syntax = "proto3";

package control;

option go_package = "millrace-cluster/internal/controlpb";

// Control is the cluster's gRPC control plane: cluster-aware topic
// creation (partition placement) and read-only cluster/topic inspection.
// Raft-level consensus (leader election, log replication) is not exposed
// here directly -- this is the application API built on top of it.
service Control {
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  rpc ClusterState(ClusterStateRequest) returns (ClusterStateResponse);
}

message CreateTopicRequest {
  string name = 1;
  uint32 num_partitions = 2;
  // 0 or 1 = no replication (one leader, no followers) -- the pre-existing
  // behavior. Must not exceed the current live node count.
  uint32 replication_factor = 3;
}

message CreateTopicResponse {
  bool ok = 1;
  // Set when ok is false: either a validation error, or "not leader" with
  // the current leader's raft address, so a caller can retry there.
  string error = 2;
  TopicInfo topic = 3;
}

message PartitionAssignment {
  uint32 partition = 1;
  // The leader's node id -- the only replica that accepts client writes.
  string node_id = 2;
  // The leader's millrace-core address; empty if that node has no
  // --brokers entry.
  string broker_addr = 3;
  // Follower node ids replicating this partition from the leader; empty
  // when the topic wasn't created with a replication_factor > 1.
  repeated string replica_ids = 4;
}

message TopicInfo {
  string name = 1;
  repeated PartitionAssignment partitions = 2;
}

message ClusterStateRequest {}

message ClusterStateResponse {
  // Raft node ID of the current leader, as seen by the node that answered
  // this RPC; empty if that node doesn't currently know of a leader.
  string leader_id = 1;
  repeated TopicInfo topics = 2;
}
